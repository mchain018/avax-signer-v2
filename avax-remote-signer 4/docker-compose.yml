version: '3.8'

services:
  avax-remote-signer:
    build:
      context: .
      dockerfile: Dockerfile
    image: avax-remote-signer:latest
    container_name: avax-remote-signer
    ports:
      - "9090:9090"
    volumes:
      # Mount configuration file
      - ./config-docker.yaml:/config/config.yaml:ro
      # Mount keys directory (read-only for security)
      - ./keys:/keys:ro
    environment:
      # Optional: Override config with environment variables
      - SIGNER_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
