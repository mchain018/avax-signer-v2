server:
  grpc_address: "0.0.0.0:9090"
  http_address: "0.0.0.0:8080"
  tls:
    enabled: false  # Disabled for testing

backend:
  type: "file"
  config:
    key_path: "./keys/validator-key.json"

logging:
  level: "info"
  format: "json"  # JSON format for container logs
  file: "/data/logs/signer.log"  # Logs written to mounted volume
